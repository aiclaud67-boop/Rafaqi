name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: |
          for z in *.zip; do unzip -oq "$z" -d proj; done
          D=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "android.useAndroidX=true" >> "$D/gradle.properties"
          echo "PROJ=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJ }}
      - uses: actions/upload-artifact@v4
        with:
          name: Rafiqi-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
